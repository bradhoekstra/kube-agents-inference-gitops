apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: vllm-inference-server
  namespace: llm-inference
spec:
  endpoints:
  - interval: 15s
    port: metrics
  selector:
    matchLabels:
      ai.gke.io/inference-server: vllm
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: llmd-epp-monitoring
  namespace: llm-inference
spec:
  endpoints:
  - interval: 15s
    port: metrics
  selector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - gemma4-epp
      - qwen3-8-27b-epp
      - glm-5-3-epp
