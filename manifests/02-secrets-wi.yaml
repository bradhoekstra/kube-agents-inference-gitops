apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-sa
  namespace: llm-inference
  annotations:
    iam.gke.io/gcp-service-account: vllm-gsa@kube-agents-inference.iam.gserviceaccount.com
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: hf-token-spc
  namespace: llm-inference
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/kube-agents-inference/secrets/hf-token/versions/latest"
        fileName: "hf_api_token"
  secretObjects:
  - secretName: hf-secret
    type: Opaque
    data:
    - objectName: hf_api_token
      key: hf_api_token
