apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-5-3-vllm
  namespace: llm-inference
  annotations:
    config.kubernetes.io/depends-on: cloud.google.com/namespaces//ComputeClass/glm5-big-gpu-class
  labels:
    app: glm-5-3-vllm
    ai.gke.io/inference-server: vllm
    ai.gke.io/model: glm-5-3
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: zai-org-GLM-5.3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: glm-5-3-vllm
  template:
    metadata:
      labels:
        app: glm-5-3-vllm
        ai.gke.io/inference-server: vllm
        ai.gke.io/model: glm-5-3
        llm-d.ai/inferenceServing: "true"
        llm-d.ai/model: zai-org-GLM-5.3
    spec:
      serviceAccountName: vllm-sa
      nodeSelector:
        cloud.google.com/compute-class: glm5-big-gpu-class
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
      - key: cloud.google.com/gke-spot
        operator: Equal
        value: "true"
        effect: NoSchedule
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: glm-5-3-vllm
      terminationGracePeriodSeconds: 60
      containers:
      - name: inference-server
        image: vllm/vllm-openai:v0.33.0
        command:
        - /bin/sh
        - -c
        - |
          export HF_TOKEN=$(cat /mnt/secrets/hf_api_token)
          exec vllm serve zai-org/GLM-5.3 \
            --tokenizer-mode=auto \
            --kv-cache-dtype=fp8_e4m3 \
            --tensor-parallel-size=8 \
            --port=8000 \
            --max-model-len=8192 \
            --max-num-seqs=16 \
            --max-num-batched-tokens=8192 \
            --gpu-memory-utilization=0.95 \
            --tool-call-parser=glm47 \
            --reasoning-parser=glm47 \
            --enable-auto-tool-choice \
            --served-model-name=zai-org/GLM-5.3
        env:
        - name: VLLM_USE_RUST_FRONTEND
          value: "0"
        - name: HF_TOKEN_PATH
          value: /mnt/secrets/hf_api_token
        ports:
        - containerPort: 8000
          name: metrics
        resources:
          requests:
            cpu: "96"
            memory: "1100Gi"
            nvidia.com/gpu: "8"
          limits:
            cpu: "96"
            memory: "1100Gi"
            nvidia.com/gpu: "8"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 160
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: secrets-store-inline
          mountPath: /mnt/secrets
          readOnly: true
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      - name: hf-cache
        emptyDir:
          medium: Memory
          sizeLimit: 800Gi
      - name: secrets-store-inline
        csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: hf-token-spc
---
apiVersion: v1
kind: Service
metadata:
  name: glm-5-3-vllm-service
  namespace: llm-inference
  labels:
    app: glm-5-3-vllm
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: glm-5-3-vllm
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: glm-5-3-vllm-pdb
  namespace: llm-inference
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: glm-5-3-vllm
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: glm-5-3-vllm-hpa
  namespace: llm-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: glm-5-3-vllm
  minReplicas: 1
  maxReplicas: 2
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-5-3-epp
  namespace: llm-inference
  labels:
    app: glm-5-3-epp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: glm-5-3-epp
  template:
    metadata:
      labels:
        app: glm-5-3-epp
    spec:
      serviceAccountName: llm-d-epp-sa
      containers:
      - name: epp
        image: registry.k8s.io/gateway-api-inference-extension/epp:v1.1.0
        args:
        - --pool-name=glm-5-3-pool
        - --pool-namespace=llm-inference
        - --grpc-port=9002
        - --grpc-health-port=9003
        - --health-checking=true
        - --metrics-endpoint-auth=false
        - --v=2
        - --config-text
        - |
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          plugins:
          - type: queue-scorer
          - type: kv-cache-utilization-scorer
          - type: prefix-cache-scorer
          schedulingProfiles:
          - name: default
            plugins:
            - pluginRef: queue-scorer
              weight: 2
            - pluginRef: kv-cache-utilization-scorer
              weight: 2
            - pluginRef: prefix-cache-scorer
              weight: 3
        ports:
        - containerPort: 9002
          name: grpc
        - containerPort: 9003
          name: grpc-health
        - containerPort: 9090
          name: metrics
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        readinessProbe:
          grpc:
            port: 9003
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        livenessProbe:
          grpc:
            port: 9003
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: glm-5-3-epp-svc
  namespace: llm-inference
spec:
  type: ClusterIP
  ports:
  - port: 9002
    targetPort: 9002
    protocol: TCP
    name: grpc
  selector:
    app: glm-5-3-epp
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: glm-5-3-pool
  namespace: llm-inference
spec:
  targetPorts:
  - number: 8000
  selector:
    matchLabels:
      app: glm-5-3-vllm
  endpointPickerRef:
    group: ""
    kind: Service
    name: glm-5-3-epp-svc
    port:
      number: 9002
    failureMode: FailOpen
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: glm-5-3-pool-healthcheck
  namespace: llm-inference
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /health
  targetRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: glm-5-3-pool
