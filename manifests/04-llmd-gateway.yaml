apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-d-epp-sa
  namespace: llm-inference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-d-epp-role
  namespace: llm-inference
rules:
- apiGroups: ["inference.networking.k8s.io", "inference.networking.x-k8s.io"]
  resources: ["inferencepools", "inferencemodels", "inferenceobjectives"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-d-epp-rolebinding
  namespace: llm-inference
subjects:
- kind: ServiceAccount
  name: llm-d-epp-sa
  namespace: llm-inference
roleRef:
  kind: Role
  name: llm-d-epp-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-epp
  namespace: llm-inference
  labels:
    app: gemma4-epp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gemma4-epp
  template:
    metadata:
      labels:
        app: gemma4-epp
    spec:
      serviceAccountName: llm-d-epp-sa
      containers:
      - name: epp
        image: registry.k8s.io/gateway-api-inference-extension/epp:v1.1.0
        args:
        - --pool-name=gemma4-31b-pool
        - --pool-namespace=llm-inference
        - --grpc-port=9002
        - --grpc-health-port=9003
        - --health-checking=true
        - --metrics-endpoint-auth=false
        - --v=2
        - --config-text
        - |
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          plugins:
          - type: queue-scorer
          - type: kv-cache-utilization-scorer
          - type: prefix-cache-scorer
          schedulingProfiles:
          - name: default
            plugins:
            - pluginRef: queue-scorer
              weight: 2
            - pluginRef: kv-cache-utilization-scorer
              weight: 2
            - pluginRef: prefix-cache-scorer
              weight: 3
        ports:
        - containerPort: 9002
          name: grpc
        - containerPort: 9003
          name: grpc-health
        - containerPort: 9090
          name: metrics
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        readinessProbe:
          grpc:
            port: 9003
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        livenessProbe:
          grpc:
            port: 9003
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-epp-svc
  namespace: llm-inference
spec:
  type: ClusterIP
  ports:
  - port: 9002
    targetPort: 9002
    protocol: TCP
    name: grpc
  selector:
    app: gemma4-epp
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: gemma4-31b-pool
  namespace: llm-inference
spec:
  targetPorts:
  - number: 8000
  selector:
    matchLabels:
      app: gemma4-31b-it-vllm
  endpointPickerRef:
    group: ""
    kind: Service
    name: gemma4-epp-svc
    port:
      number: 9002
    failureMode: FailOpen
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-inference-gateway
  namespace: llm-inference
spec:
  gatewayClassName: gke-l7-rilb
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: networking.gke.io/v1
kind: GCPGatewayPolicy
metadata:
  name: internal-inference-gateway-policy
  namespace: llm-inference
spec:
  default:
    allowGlobalAccess: true
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: internal-inference-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gemma4-inference-route
  namespace: llm-inference
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: internal-inference-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
      headers:
      - name: X-Gateway-Model-Name
        type: Exact
        value: zai-org/GLM-5.3
    - path:
        type: PathPrefix
        value: /
      headers:
      - name: x-model
        type: Exact
        value: zai-org/GLM-5.3
    # vLLM answers in minutes at this model's decode rate; the class default of
    # 30 s cut every long answer (HTTP 504 at 30.0 s on a direct probe).
    timeouts:
      request: 1800s
      backendRequest: 1800s
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: glm-5-3-pool
      port: 8000
      weight: 100
  - matches:
    - path:
        type: PathPrefix
        value: /glm5
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    timeouts:
      request: 1800s
      backendRequest: 1800s
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: glm-5-3-pool
      port: 8000
      weight: 100
  - matches:
    - path:
        type: PathPrefix
        value: /
      headers:
      - name: X-Gateway-Model-Name
        type: Exact
        value: Qwen/Qwen3.8-27B
    - path:
        type: PathPrefix
        value: /
      headers:
      - name: x-model
        type: Exact
        value: Qwen/Qwen3.8-27B
    timeouts:
      request: 1800s
      backendRequest: 1800s
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: qwen3-8-27b-pool
      port: 8000
      weight: 100
  - matches:
    - path:
        type: PathPrefix
        value: /qwen3
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    timeouts:
      request: 1800s
      backendRequest: 1800s
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: qwen3-8-27b-pool
      port: 8000
      weight: 100
  - matches:
    - path:
        type: PathPrefix
        value: /
      headers:
      - name: X-Gateway-Model-Name
        type: Exact
        value: google/gemma-4-E4B-it
    - path:
        type: PathPrefix
        value: /
      headers:
      - name: x-model
        type: Exact
        value: google/gemma-4-E4B-it
    timeouts:
      request: 1800s
      backendRequest: 1800s
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: gemma4-e4b-pool
      port: 8000
      weight: 100
  - matches:
    - path:
        type: PathPrefix
        value: /gemma4-e4b
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    timeouts:
      request: 1800s
      backendRequest: 1800s
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: gemma4-e4b-pool
      port: 8000
      weight: 100
  - matches:
    - path:
        type: PathPrefix
        value: /gemma4
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    timeouts:
      request: 1800s
      backendRequest: 1800s
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: gemma4-31b-pool
      port: 8000
      weight: 100
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 1800s
      backendRequest: 1800s
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: gemma4-31b-pool
      port: 8000
      weight: 100
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: gemma4-pool-healthcheck
  namespace: llm-inference
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /health
  targetRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: gemma4-31b-pool
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: gemma4-31b-pool-timeout
  namespace: llm-inference
spec:
  # The pools' backend services kept the 30-second default after the route's
  # timeouts landed: an InferencePool backend takes its timeout from this policy,
  # as it takes its health check. 1800 s covers the longest agent turn.
  default:
    timeoutSec: 1800
  targetRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: gemma4-31b-pool
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: gemma4-e4b-pool-timeout
  namespace: llm-inference
spec:
  default:
    timeoutSec: 1800
  targetRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: gemma4-e4b-pool
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: qwen3-8-27b-pool-timeout
  namespace: llm-inference
spec:
  default:
    timeoutSec: 1800
  targetRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: qwen3-8-27b-pool
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: glm-5-3-pool-timeout
  namespace: llm-inference
spec:
  default:
    timeoutSec: 1800
  targetRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: glm-5-3-pool
