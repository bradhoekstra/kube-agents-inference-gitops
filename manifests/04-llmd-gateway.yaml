apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-d-epp-sa
  namespace: llm-inference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-d-epp-role
  namespace: llm-inference
rules:
- apiGroups: ["inference.networking.k8s.io", "inference.networking.x-k8s.io"]
  resources: ["inferencepools", "inferencemodels", "inferenceobjectives"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-d-epp-rolebinding
  namespace: llm-inference
subjects:
- kind: ServiceAccount
  name: llm-d-epp-sa
  namespace: llm-inference
roleRef:
  kind: Role
  name: llm-d-epp-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-epp
  namespace: llm-inference
  labels:
    app: gemma4-epp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gemma4-epp
  template:
    metadata:
      labels:
        app: gemma4-epp
    spec:
      serviceAccountName: llm-d-epp-sa
      containers:
      - name: epp
        image: registry.k8s.io/gateway-api-inference-extension/epp:v1.1.0
        args:
        - --pool-name=gemma4-31b-pool
        - --pool-namespace=llm-inference
        - --grpc-port=9002
        - --grpc-health-port=9003
        - --v=2
        ports:
        - containerPort: 9002
          name: grpc
        - containerPort: 9003
          name: grpc-health
        - containerPort: 9090
          name: metrics
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        readinessProbe:
          grpc:
            port: 9003
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        livenessProbe:
          grpc:
            port: 9003
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-epp-svc
  namespace: llm-inference
spec:
  type: ClusterIP
  ports:
  - port: 9002
    targetPort: 9002
    protocol: TCP
    name: grpc
  selector:
    app: gemma4-epp
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: gemma4-31b-pool
  namespace: llm-inference
spec:
  targetPorts:
  - number: 8000
  selector:
    matchLabels:
      app: gemma4-31b-it-vllm
  endpointPickerRef:
    group: ""
    kind: Service
    name: gemma4-epp-svc
    port:
      number: 9002
    failureMode: FailOpen
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-inference-gateway
  namespace: llm-inference
spec:
  gatewayClassName: gke-l7-rilb
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gemma4-inference-route
  namespace: llm-inference
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: internal-inference-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: gemma4-31b-pool
      port: 8000
      weight: 100
