apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma4-31b-it-vllm
  namespace: llm-inference
  labels:
    app: gemma4-31b-it-vllm
    ai.gke.io/inference-server: vllm
    ai.gke.io/model: gemma4-31b-it
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: google-gemma-4-31B-it
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemma4-31b-it-vllm
  template:
    metadata:
      labels:
        app: gemma4-31b-it-vllm
        ai.gke.io/inference-server: vllm
        ai.gke.io/model: gemma4-31b-it
        llm-d.ai/inferenceServing: "true"
        llm-d.ai/model: google-gemma-4-31B-it
    spec:
      serviceAccountName: vllm-sa
      nodeSelector:
        cloud.google.com/compute-class: gemma4-gpu-class
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: gemma4-31b-it-vllm
      terminationGracePeriodSeconds: 60
      containers:
      - name: inference-server
        image: vllm/vllm-openai:gemma4
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        args:
        - --model=$(MODEL_ID)
        - --tensor-parallel-size=$(TENSOR_PARALLEL_SIZE)
        - --port=8000
        - --max-model-len=8192
        - --max-num-seqs=32
        - --max-num-batched-tokens=8192
        - --gpu-memory-utilization=0.92
        - --enable-prefix-caching
        env:
        - name: MODEL_ID
          value: google/gemma-4-31B-it
        - name: TENSOR_PARALLEL_SIZE
          value: "1"
        - name: HF_TOKEN_PATH
          value: /mnt/secrets/hf_api_token
        ports:
        - containerPort: 8000
          name: metrics
        resources:
          requests:
            cpu: "12"
            memory: "64Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "12"
            memory: "64Gi"
            nvidia.com/gpu: "1"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: secrets-store-inline
          mountPath: /mnt/secrets
          readOnly: true
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: secrets-store-inline
        csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: hf-token-spc
---
apiVersion: v1
kind: Service
metadata:
  name: gemma4-31b-it-vllm-service
  namespace: llm-inference
  labels:
    app: gemma4-31b-it-vllm
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: gemma4-31b-it-vllm
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gemma4-31b-it-vllm-pdb
  namespace: llm-inference
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: gemma4-31b-it-vllm
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gemma4-31b-it-vllm-hpa
  namespace: llm-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gemma4-31b-it-vllm
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
