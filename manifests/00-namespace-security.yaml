apiVersion: v1
kind: Namespace
metadata:
  name: llm-inference
  labels:
    app.kubernetes.io/name: llm-inference
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: llm-inference
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inference-traffic
  namespace: llm-inference
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9002
    - protocol: TCP
      port: 9003
    - protocol: TCP
      port: 9090
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: llm-inference-quota
  namespace: llm-inference
spec:
  hard:
    requests.cpu: "512"
    requests.memory: 4096Gi
    limits.cpu: "512"
    limits.memory: 4096Gi
    requests.nvidia.com/gpu: "32"
